name: Frontend CI/CD

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

env:
  NODE_VERSION: '24'

jobs:
  # ───────────────────── CI: TEST & BUILD ─────────────────────
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Cài đặt dependencies
        run: npm ci

      - name: Kiểm tra TypeScript (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Chạy lint (nếu có)
        run: npm run lint --if-present

      - name: Chạy unit tests (nếu có)
        run: npm test -- --watchAll=false --passWithNoTests

      - name: Build production
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: fe-dist
          path: dist/
          retention-days: 7

  # ───────────────────── CD: DEPLOY TO RAILWAY ─────────────────────
  deploy:
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: fe-dist
          path: dist/

      - name: Cài đặt Railway CLI
        uses: railway/railway-action@v3
        with:
          railway_token: ${{ secrets.RAILWAY_TOKEN_FE }}
        env:
          RAILWAY_SERVICE_NAME: frontend
